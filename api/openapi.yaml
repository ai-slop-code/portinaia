        change: { type: string, enum: [added, removed, changed] }
        before:
          {
            allOf:
              [{ $ref: "#/components/schemas/NetworkInterfaceObservation" }],
          }
        after:
          {
            allOf:
              [{ $ref: "#/components/schemas/NetworkInterfaceObservation" }],
          }
        fields:
          {
            type: array,
            maxItems: 256,
            items: { $ref: "#/components/schemas/FieldChange" },
          }
    FilesystemChange:
      type: object
      additionalProperties: false
      required: [key, change]
      properties:
        key: { type: string, minLength: 1, maxLength: 4096 }
        change: { type: string, enum: [added, removed, changed] }
        before: { allOf: [{ $ref: "#/components/schemas/FilesystemSnapshot" }] }
        after: { allOf: [{ $ref: "#/components/schemas/FilesystemSnapshot" }] }
        fields:
          {
            type: array,
            maxItems: 256,
            items: { $ref: "#/components/schemas/FieldChange" },
          }
    ContainerChange:
