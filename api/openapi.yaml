openapi: 3.0.3
info:
  title: Portinaia API
  version: 1.0.0
  description: |
    Versioned API for Portinaia inventory, discovery, history, DNS control,
    authentication, audit, and operations. UUID identifiers are canonical
    lower-case UUIDv7 strings and timestamps are RFC 3339 UTC values.
servers:
  - url: /api/v1
    description: Product API version 1
security:
  - sessionCookie: []
  - personalAccessToken: []
tags:
  - { name: Authentication, description: Administrator browser sessions. }
  - {
      name: Personal access tokens,
      description: Named scoped automation credentials.,
    }
  - { name: Providers, description: Commercial supplier inventory. }
  - { name: Locations, description: Physical sites and provider regions. }
  - { name: Computes, description: "Physical hosts, VPSs, and VMs." }
  - {
      name: Containers,
      description: Podman workload inventory and observations.,
    }
  - {
      name: IP assignments,
      description: Manual and discovered address assignments.,
    }
  - { name: Domains, description: Registered domain inventory. }
  - { name: Costs, description: Compute and domain costs. }
  - { name: Tags, description: Normalized inventory tags. }
  - { name: Inventory, description: Cross-resource hierarchy reads. }
  - { name: Dashboard, description: Bounded dashboard aggregates. }
  - { name: Agents, description: Discovery agent administration. }
  - {
      name: Agent protocol,
      description: Credential-isolated discovery client protocol.,
    }
  - {
      name: History,
      description: Retained discovery reports and structured differences.,
    }
  - { name: DNS zones, description: Cloudflare zone discovery and selection. }
  - { name: DNS imports, description: Selective Cloudflare record adoption. }
  - {
      name: DNS names,
      description: Desired DNS-name aggregates and projection status.,
    }
  - { name: DNS drafts, description: Previewed DNS change workflow. }
  - { name: Audit, description: Immutable mutation audit history. }
  - {
      name: Health,
      description: Unauthenticated liveness and readiness checks.,
    }
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an administrator session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current browser session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { $ref: "#/components/responses/LogoutNoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Read the current administrator session
      security:
        - sessionCookie: []
      responses:
        "200": { $ref: "#/components/responses/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /personal-access-tokens:
    get:
      tags: [Personal access tokens]
      operationId: listPersonalAccessTokens
      x-required-scopes: [admin]
      summary: List personal access tokens
      parameters:
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Personal access token page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonalAccessTokenPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Personal access tokens]
      operationId: createPersonalAccessToken
      x-required-scopes: [admin]
      summary: Create a personal access token
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalAccessTokenCreate" }
      responses:
        "201":
          { $ref: "#/components/responses/PersonalAccessTokenSecretResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /personal-access-tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [Personal access tokens]
      operationId: revokePersonalAccessToken
      x-required-scopes: [admin]
      summary: Revoke a personal access token
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { $ref: "#/components/responses/NoContentNoStore" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /providers:
    get:
      tags: [Providers]
      operationId: listProviders
      x-required-scopes: ["inventory:read"]
      summary: List and search providers
      parameters:
        - $ref: "#/components/parameters/PageAfter"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Archived"
      responses:
