      }
    ZoneSelectionFilter:
      {
        name: selection,
        in: query,
        schema: { $ref: "#/components/schemas/DnsZoneSelection" },
      }
    DnsViewFilter:
      {
        name: view,
        in: query,
        schema: { $ref: "#/components/schemas/DnsViewName" },
      }
    DnsTypeFilter:
      {
        name: type,
        in: query,
        schema: { $ref: "#/components/schemas/DnsRecordType" },
      }
    WildcardFilter: { name: wildcard, in: query, schema: { type: boolean } }
    ProxiedFilter: { name: proxied, in: query, schema: { type: boolean } }
    ProjectionStateFilter:
      {
        name: projection_state,
        in: query,
        schema: { $ref: "#/components/schemas/DnsProjectionState" },
      }
    FromTime:
      {
        name: from_time,
        in: query,
        schema: { $ref: "#/components/schemas/Timestamp" },
      }
    ToTime:
      {
        name: to_time,
        in: query,
        schema: { $ref: "#/components/schemas/Timestamp" },
      }
    ActorTypeFilter:
      {
        name: actor_type,
        in: query,
        schema: { $ref: "#/components/schemas/AuditActorType" },
      }
    ActorIdFilter:
      {
        name: actor_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ActionFilter:
      {
        name: action,
        in: query,
        schema: { type: string, minLength: 1, maxLength: 100 },
      }
    ResourceTypeFilter:
      {
        name: resource_type,
        in: query,
        schema: { type: string, minLength: 1, maxLength: 100 },
      }
    ResourceIdFilter:
      {
        name: resource_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }

  headers:
    ETag:
      description: Strong ETag corresponding to the resource revision.
      required: true
      schema: { $ref: "#/components/schemas/EntityTag" }
    Location:
      description: URI of the created resource.
      required: true
      schema: { type: string, maxLength: 1024 }
    CacheControlNoStore:
      description: Prevents storage of authentication or plaintext-secret responses.
      required: true
      schema: { type: string, enum: [no-store] }
    SetCookie:
      description: Sets or clears the HttpOnly administrator session cookie.
      required: true
      schema: { type: string, maxLength: 4096 }
    RetryAfter:
      description: Seconds until a retry should be attempted.
      schema: { type: integer, minimum: 1, maximum: 86400 }

  responses:
    BadRequest:
      {
        description: Malformed request,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Unauthorized:
      description: "Authentication is missing, invalid, expired, or revoked"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      {
        description: Authenticated actor lacks the required scope or CSRF token,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotFound:
      {
        description: Resource not found,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Conflict:
      description: "State, dependency, uniqueness, idempotency, or unmanaged-provider conflict"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      {
        description: If-Match does not match the current revision,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    ValidationFailed:
      {
        description: Semantic validation failed,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    PayloadTooLarge:
      {
        description: Request exceeds the configured body limit,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    TooManyRequests:
      description: Rate limit exceeded
      headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }
      content:
        {
          application/problem+json:
            { schema: { $ref: "#/components/schemas/Problem" } },
        }
    ProviderUnavailable:
      {
        description: Required sanitized provider observation is unavailable,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    ServiceUnavailable:
      {
        description: A required local service is temporarily unavailable,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NoContent: { description: Operation completed; no response body }
    NoContentNoStore:
      description: Operation completed; no response body
      headers:
        { Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" } }
    LogoutNoContent:
      description: Session revoked and cookie cleared; no response body
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" },
          Set-Cookie: { $ref: "#/components/headers/SetCookie" },
        }
    LoginResponse:
      description: Session created
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" },
          Set-Cookie: { $ref: "#/components/headers/SetCookie" },
        }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/Session" } },
        }
    SessionResponse:
      description: Current session
      headers:
        { Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" } }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/Session" } },
        }
    PersonalAccessTokenSecretResponse:
      description: Token created; plaintext is returned only in this response
      headers:
        {
          Location: { $ref: "#/components/headers/Location" },
          Cache-Control: { $ref: "#/components/headers/CacheControlNoStore" },
        }
      content:
        {
