        to_report_id: { $ref: "#/components/schemas/UuidV7" }
        host:
          {
            type: array,
            maxItems: 256,
            items: { $ref: "#/components/schemas/FieldChange" },
          }
        interfaces:
          {
            type: array,
            maxItems: 2048,
            items: { $ref: "#/components/schemas/InterfaceChange" },
