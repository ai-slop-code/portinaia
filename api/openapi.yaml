components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portinaia_session
      description: Server-side administrator browser session. Mutations also require X-CSRF-Token.
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Portinaia PAT
      description: |
        Named personal access token. The server enforces inventory:read,
        inventory:write, dns:read, dns:write, agents, audit:read, and admin
        scopes per operation. Each operation's x-required-scopes array lists
        every scope a personal access token must possess. Administrator browser
        sessions satisfy these scope requirements implicitly.
    enrollmentBearer:
      type: http
      scheme: bearer
      bearerFormat: Portinaia Enrollment Token
      description: Single-use, compute-bound token valid only for agent enrollment.
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: Portinaia Agent Credential
      description: Long-lived credential bound to exactly one enrolled agent.

  parameters:
    PageAfter:
      name: page[after]
      in: query
      description: Opaque cursor returned by the previous page.
      schema: { type: string, minLength: 1, maxLength: 512 }
    PageSize:
      name: page[size]
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Search:
      name: q
      in: query
      description: Case-insensitive text search using the collection's stable default ordering.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Archived:
      name: archived
      in: query
      description: Archived resources are excluded by default.
      schema: { type: string, enum: [exclude, include, only], default: exclude }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag from the latest representation.
      schema: { $ref: "#/components/schemas/EntityTag" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Caller-generated key scoped to the authenticated actor and operation.
        Reuse with a different request returns 409.
      schema:
        { type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]+$" }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Required caller-generated key scoped to the authenticated actor and apply operation.
      schema:
        { type: string, minLength: 16, maxLength: 128, pattern: "^[!-~]+$" }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for mutations authenticated by sessionCookie; omitted for bearer authentication.
      schema:
        {
          type: string,
          minLength: 32,
          maxLength: 256,
          pattern: "^[A-Za-z0-9_-]+$",
        }
    ProviderId:
      {
        name: provider_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    LocationId:
      {
        name: location_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ComputeId:
      {
        name: compute_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ContainerId:
      {
        name: container_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    IpAssignmentId:
      {
        name: ip_assignment_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    DomainId:
      {
        name: domain_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    CostId:
      {
        name: cost_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    TagId:
      {
        name: tag_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    AgentId:
      {
        name: agent_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    TokenId:
      {
        name: token_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ReportId:
      {
        name: report_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ZoneId:
      {
        name: zone_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    DnsNameId:
      {
        name: name_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    DraftId:
      {
        name: draft_id,
        in: path,
        required: true,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ProviderFilter:
      {
        name: provider_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    RegistrarFilter:
      {
        name: registrar_provider_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    LocationFilter:
      {
        name: location_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ComputeFilter:
      {
        name: compute_id,
        in: query,
        schema: { $ref: "#/components/schemas/UuidV7" },
      }
    ContainerFilter:
      {
        name: container_id,
        in: query,
