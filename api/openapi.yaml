      properties:
        connection: { type: string, minLength: 1, maxLength: 200 }
        owner: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 255 }
        change: { type: string, enum: [added, removed, changed] }
        before: { allOf: [{ $ref: "#/components/schemas/SnapshotContainer" }] }
        after: { allOf: [{ $ref: "#/components/schemas/SnapshotContainer" }] }
        fields:
          {
            type: array,
            maxItems: 2048,
