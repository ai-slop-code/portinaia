    DnsViewName: { type: string, enum: [public, internal] }
    DnsRecordType: { type: string, enum: [A, AAAA, CNAME] }
    DnsPublicARecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values, proxied]
      properties:
        type: { type: string, enum: [A] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: ipv4, maxLength: 15 },
          }
        proxied: { type: boolean, default: false }
    DnsPublicAaaaRecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values, proxied]
      properties:
        type: { type: string, enum: [AAAA] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: ipv6, maxLength: 45 },
          }
        proxied: { type: boolean, default: false }
    DnsPublicCnameRecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values, proxied]
      properties:
        type: { type: string, enum: [CNAME] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 1,
            items:
              {
                type: string,
                minLength: 1,
                maxLength: 253,
                pattern: '^[a-z0-9.-]+\.?$',
              },
          }
        proxied: { type: boolean, default: false }
    DnsInternalARecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values]
      properties:
        type: { type: string, enum: [A] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: ipv4, maxLength: 15 },
          }
    DnsInternalAaaaRecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values]
      properties:
        type: { type: string, enum: [AAAA] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            uniqueItems: true,
            items: { type: string, format: ipv6, maxLength: 45 },
          }
    DnsInternalCnameRecordSet:
      type: object
      additionalProperties: false
      required: [type, ttl, values]
      properties:
        type: { type: string, enum: [CNAME] }
        ttl: { type: integer, minimum: 60, maximum: 86400, default: 60 }
        values:
          {
            type: array,
            minItems: 1,
            maxItems: 1,
            items:
              {
                type: string,
                minLength: 1,
                maxLength: 253,
                pattern: '^[a-z0-9.-]+\.?$',
              },
          }
    DnsRecordSet:
      oneOf:
        - $ref: "#/components/schemas/DnsPublicARecordSet"
        - $ref: "#/components/schemas/DnsPublicAaaaRecordSet"
        - $ref: "#/components/schemas/DnsPublicCnameRecordSet"
      discriminator:
        propertyName: type
        mapping:
          A: "#/components/schemas/DnsPublicARecordSet"
          AAAA: "#/components/schemas/DnsPublicAaaaRecordSet"
          CNAME: "#/components/schemas/DnsPublicCnameRecordSet"
    DnsInternalRecordSet:
      oneOf:
        - $ref: "#/components/schemas/DnsInternalARecordSet"
        - $ref: "#/components/schemas/DnsInternalAaaaRecordSet"
        - $ref: "#/components/schemas/DnsInternalCnameRecordSet"
      discriminator:
        propertyName: type
        mapping:
          A: "#/components/schemas/DnsInternalARecordSet"
          AAAA: "#/components/schemas/DnsInternalAaaaRecordSet"
          CNAME: "#/components/schemas/DnsInternalCnameRecordSet"
    DnsPublicView:
      type: object
      additionalProperties: false
      required: [record_sets]
      description: Record-set types must be unique. CNAME is exclusive and cannot coexist with A or AAAA in this view.
      properties:
        {
          record_sets:
            {
              type: array,
              maxItems: 3,
              items: { $ref: "#/components/schemas/DnsRecordSet" },
            },
        }
    DnsInternalView:
      type: object
      additionalProperties: false
      required: [record_sets]
      description: Record-set types must be unique. CNAME is exclusive and cannot coexist with A or AAAA in this view.
      properties:
        {
          record_sets:
            {
              type: array,
              maxItems: 3,
              items: { $ref: "#/components/schemas/DnsInternalRecordSet" },
            },
        }
