  /discovery-reports/{report_id}/snapshot:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [History]
      operationId: getDiscoveryReportSnapshot
      x-required-scopes: [agents]
      summary: Stream a retained canonical snapshot
      description: |
        Streams the stored gzip-compressed canonical JSON without materializing
        the complete document in memory. The decompressed JSON conforms to
        CanonicalSnapshot and is bounded by the snapshot ingestion limits.
      x-streaming: true
      responses:
        {
          "200":
            {
              description: Gzip-compressed canonical snapshot JSON stream,
              headers:
                {
                  Content-Disposition:
                    {
                      description: Attachment filename for the canonical snapshot.,
                      required: true,
                      schema:
                        {
                          type: string,
                          pattern: '^attachment; filename="snapshot-[0-9a-f-]+\.json\.gz"$',
                        },
                    },
                },
              content:
                {
                  application/gzip:
                    { schema: { type: string, format: binary } },
                },
            },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
