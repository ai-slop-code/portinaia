      }
    StaleFilter: { name: stale, in: query, schema: { type: boolean } }
    SourceFilter:
      {
        name: source,
        in: query,
        schema: { $ref: "#/components/schemas/IpAssignmentSource" },
      }
    AgentStatusFilter:
      {
        name: status,
        in: query,
