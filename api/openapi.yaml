    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    put:
      tags: [Agent protocol]
      operationId: putAgentSnapshotV1
      summary: Idempotently submit a complete discovery snapshot
      description: |
        Repeating the same report ID and equivalent content returns the original
        acceptance result. The report_id in the request body MUST equal the
        report_id path parameter; a mismatch returns 409 Conflict with code
        report_id_mismatch.
      x-path-body-constraints:
        - path_parameter: report_id
          body_property: report_id
          relation: equal
      security:
        - agentBearer: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema: { $ref: "#/components/schemas/DiscoverySnapshotWrite" },
