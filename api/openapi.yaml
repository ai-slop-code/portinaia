        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Providers]
      operationId: createProvider
      x-required-scopes: ["inventory:write"]
      summary: Create a provider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody: { $ref: "#/components/requestBodies/ProviderWrite" }
      responses:
        "201": { $ref: "#/components/responses/ProviderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /providers/{provider_id}:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    get:
      tags: [Providers]
      operationId: getProvider
      x-required-scopes: ["inventory:read"]
      summary: Read a provider
      responses:
        "200": { $ref: "#/components/responses/ProviderResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Providers]
      operationId: updateProvider
      x-required-scopes: ["inventory:write"]
      summary: Replace writable provider fields
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody: { $ref: "#/components/requestBodies/ProviderWrite" }
      responses:
        "200": { $ref: "#/components/responses/ProviderResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /providers/{provider_id}/archive:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    post:
      tags: [Providers]
      operationId: archiveProvider
      x-required-scopes: ["inventory:write"]
      summary: Archive a provider
      parameters:
        [
          { $ref: "#/components/parameters/IfMatch" },
          { $ref: "#/components/parameters/CsrfToken" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/ProviderResponse" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
          "412": { $ref: "#/components/responses/PreconditionFailed" },
        }
  /providers/{provider_id}/restore:
    parameters: [{ $ref: "#/components/parameters/ProviderId" }]
    post:
      tags: [Providers]
      operationId: restoreProvider
      x-required-scopes: ["inventory:write"]
      summary: Restore an archived provider
      parameters:
        [
          { $ref: "#/components/parameters/IfMatch" },
