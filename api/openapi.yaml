      type: object
      additionalProperties: false
      required: [operation, target_name_id, base_revision]
      properties:
        operation: { type: string, enum: [delete] }
        target_name_id: { $ref: "#/components/schemas/UuidV7" }
        base_revision: { $ref: "#/components/schemas/Revision" }
    DnsDraftWrite:
      oneOf:
        - $ref: "#/components/schemas/DnsCreateDraftWrite"
        - $ref: "#/components/schemas/DnsUpdateDraftWrite"
        - $ref: "#/components/schemas/DnsDeleteDraftWrite"
      discriminator:
        propertyName: operation
        mapping:
          create: "#/components/schemas/DnsCreateDraftWrite"
          update: "#/components/schemas/DnsUpdateDraftWrite"
          delete: "#/components/schemas/DnsDeleteDraftWrite"
    DnsDraftStatus: { type: string, enum: [active, applied, discarded] }
    DnsDraftValidation: { type: string, enum: [unvalidated, valid, invalid] }
    DnsDraft:
      type: object
      additionalProperties: false
      required:
        [
          id,
          revision,
          operation,
          status,
          validation,
          content_hash,
          actor_id,
          created_at,
          updated_at,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        revision: { $ref: "#/components/schemas/Revision" }
        operation: { $ref: "#/components/schemas/DnsDraftOperation" }
        target_name_id: { $ref: "#/components/schemas/UuidV7" }
        base_revision:
          { type: integer, format: int64, minimum: 1, nullable: true }
        proposed: { allOf: [{ $ref: "#/components/schemas/DnsNameWrite" }] }
        status: { $ref: "#/components/schemas/DnsDraftStatus" }
        validation: { $ref: "#/components/schemas/DnsDraftValidation" }
        content_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        actor_id: { $ref: "#/components/schemas/UuidV7" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        applied_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        discarded_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        latest_preview: { allOf: [{ $ref: "#/components/schemas/DnsPreview" }] }
    DnsDraftApply:
      type: object
      additionalProperties: false
      required: [expected_base_revision, preview_fingerprint]
      properties:
        expected_base_revision: { type: integer, format: int64, minimum: 0 }
        preview_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
    DnsApplyResult:
      type: object
      additionalProperties: false
      required: [draft_id, name, projections]
      properties:
        draft_id: { $ref: "#/components/schemas/UuidV7" }
        name: { $ref: "#/components/schemas/DnsName" }
        projections:
          {
            type: array,
            maxItems: 2,
            items: { $ref: "#/components/schemas/DnsProjection" },
          }
    ReconcileAccepted:
      type: object
      additionalProperties: false
      required: [accepted_at, aggregate_count]
      properties:
        accepted_at: { $ref: "#/components/schemas/Timestamp" }
        aggregate_count: { type: integer, minimum: 0 }

    AuditActorType:
      {
        type: string,
        enum: [administrator, personal_access_token, agent, system],
      }
    AuditResult: { type: string, enum: [success, rejected] }
    AuditField:
      type: object
      additionalProperties: false
      required: [path, redacted]
      properties:
        path: { type: string, minLength: 1, maxLength: 500 }
        before: { type: string, maxLength: 10000, nullable: true }
        after: { type: string, maxLength: 10000, nullable: true }
        redacted: { type: boolean }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          sequence,
          occurred_at,
          actor_type,
          action,
          resource_type,
          request_id,
          result,
          changes,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        sequence: { type: integer, format: int64, minimum: 1 }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
        actor_type: { $ref: "#/components/schemas/AuditActorType" }
        actor_id: { $ref: "#/components/schemas/UuidV7" }
        action: { type: string, minLength: 1, maxLength: 100 }
        resource_type: { type: string, minLength: 1, maxLength: 100 }
        resource_id: { $ref: "#/components/schemas/UuidV7" }
        request_id: { type: string, minLength: 1, maxLength: 128 }
        result: { $ref: "#/components/schemas/AuditResult" }
        changes:
          {
            type: array,
            maxItems: 500,
            items: { $ref: "#/components/schemas/AuditField" },
          }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/AuditEvent" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status: { type: string, enum: [live] }
        time: { $ref: "#/components/schemas/Timestamp" }
    ReadinessCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [ready, not_ready] }
        message: { type: string, maxLength: 1000 }
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, time, checks]
      properties:
        status: { type: string, enum: [ready] }
        time: { $ref: "#/components/schemas/Timestamp" }
        checks:
          {
            type: array,
            maxItems: 32,
            items: { $ref: "#/components/schemas/ReadinessCheck" },
          }
