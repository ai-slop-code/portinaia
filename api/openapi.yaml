    Container:
      allOf:
        - $ref: "#/components/schemas/ResourceMetadata"
        - type: object
          required: [compute_id, podman_owner, name, tag_ids]
          properties:
            compute_id: { $ref: "#/components/schemas/UuidV7" }
            podman_connection: { type: string, minLength: 1, maxLength: 200 }
            podman_owner: { type: string, minLength: 1, maxLength: 200 }
            name: { type: string, minLength: 1, maxLength: 255 }
            description: { type: string, maxLength: 2000 }
            notes: { type: string, maxLength: 10000 }
            tag_ids:
              {
                type: array,
                maxItems: 100,
                uniqueItems: true,
                items: { $ref: "#/components/schemas/UuidV7" },
              }
            observation:
              {
                allOf: [{ $ref: "#/components/schemas/ContainerObservation" }],
                readOnly: true,
              }
    ContainerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/Container" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    IpScope:
      { type: string, enum: [public, private, loopback, link_local, other] }
    IpAssignmentSource: { type: string, enum: [manual, discovered] }
    IpAssignmentWrite:
      type: object
      required: [address, scope, primary]
      properties:
        address: { type: string, format: ip, maxLength: 45 }
        prefix_length:
          { type: integer, minimum: 0, maximum: 128, nullable: true }
        compute_id: { $ref: "#/components/schemas/UuidV7" }
        container_id: { $ref: "#/components/schemas/UuidV7" }
        interface_or_network: { type: string, maxLength: 255 }
        scope: { $ref: "#/components/schemas/IpScope" }
        role: { type: string, maxLength: 100 }
        primary: { type: boolean }
        description: { type: string, maxLength: 2000 }
    IpAssignmentObservation:
      type: object
      additionalProperties: false
      required: [first_observed_at, last_observed_at]
      properties:
        first_observed_at: { $ref: "#/components/schemas/Timestamp" }
        last_observed_at: { $ref: "#/components/schemas/Timestamp" }
        stale_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
    IpAssignment:
      allOf:
        - $ref: "#/components/schemas/ResourceMetadata"
        - $ref: "#/components/schemas/IpAssignmentWrite"
        - type: object
          required: [source]
          properties:
            source: { $ref: "#/components/schemas/IpAssignmentSource" }
            observation:
              {
                allOf:
                  [{ $ref: "#/components/schemas/IpAssignmentObservation" }],
                readOnly: true,
              }
    IpAssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/IpAssignment" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    DomainWrite:
      type: object
      required: [name, nameservers, tag_ids]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 253,
            pattern: "^[a-z0-9.-]+$",
          }
        registrar_provider_id: { $ref: "#/components/schemas/UuidV7" }
        registered_on: { $ref: "#/components/schemas/Date" }
        expires_on: { $ref: "#/components/schemas/Date" }
        auto_renew: { type: boolean, nullable: true }
        nameservers:
          {
            type: array,
            maxItems: 32,
            uniqueItems: true,
            items:
              {
                type: string,
                minLength: 1,
                maxLength: 253,
                pattern: "^[a-z0-9.-]+$",
              },
          }
        description: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 10000 }
        tag_ids:
          {
            type: array,
            maxItems: 100,
            uniqueItems: true,
            items: { $ref: "#/components/schemas/UuidV7" },
          }
    Domain:
      allOf:
        - $ref: "#/components/schemas/ResourceMetadata"
        - $ref: "#/components/schemas/DomainWrite"
        - type: object
          required: [expiry_state]
          properties:
            expiry_state:
              { type: string, enum: [unknown, current, expiring, expired] }
            dns_zone_id: { allOf: [{ $ref: "#/components/schemas/UuidV7" }] }
    DomainPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/Domain" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    CostType: { type: string, enum: [recurring, one_time] }
    RecurringCostWrite:
      type: object
      required:
        [owner_type, owner_id, type, amount, billing_interval, effective_from]
      not: { required: [charged_on] }
      properties:
        owner_type: { type: string, enum: [compute, domain] }
        owner_id: { $ref: "#/components/schemas/UuidV7" }
        type: { type: string, enum: [recurring] }
        amount: { $ref: "#/components/schemas/Money" }
        billing_interval:
          type: string
          enum: [P1M, P3M, P6M, P1Y]
          description: >-
            Recurring interval; maps to monthly, quarterly, semiannual, and annual in storage.
        effective_from: { $ref: "#/components/schemas/Date" }
        effective_to: { $ref: "#/components/schemas/Date" }
        description: { type: string, maxLength: 2000 }
        provider_reference: { type: string, maxLength: 500 }
    OneTimeCostWrite:
      type: object
      required: [owner_type, owner_id, type, amount, charged_on]
      not:
        anyOf:
          - { required: [billing_interval] }
          - { required: [effective_from] }
          - { required: [effective_to] }
      properties:
        owner_type: { type: string, enum: [compute, domain] }
        owner_id: { $ref: "#/components/schemas/UuidV7" }
        type: { type: string, enum: [one_time] }
        amount: { $ref: "#/components/schemas/Money" }
        charged_on: { $ref: "#/components/schemas/Date" }
        description: { type: string, maxLength: 2000 }
        provider_reference: { type: string, maxLength: 500 }
    CostWrite:
      oneOf:
        - $ref: "#/components/schemas/RecurringCostWrite"
        - $ref: "#/components/schemas/OneTimeCostWrite"
      discriminator:
        propertyName: type
        mapping:
          recurring: "#/components/schemas/RecurringCostWrite"
          one_time: "#/components/schemas/OneTimeCostWrite"
    Cost:
      {
        allOf:
          [
            { $ref: "#/components/schemas/ResourceMetadata" },
            { $ref: "#/components/schemas/CostWrite" },
          ],
      }
    CostPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/Cost" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    TagWrite:
      type: object
      required: [name, display_name]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            pattern: "^[a-z0-9][a-z0-9_-]*$",
          }
        display_name: { type: string, minLength: 1, maxLength: 100 }
    Tag:
      {
        allOf:
          [
            { $ref: "#/components/schemas/ResourceMetadata" },
            { $ref: "#/components/schemas/TagWrite" },
          ],
      }
    TagPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/Tag" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }

    InventoryTreeNode:
      type: object
      additionalProperties: false
      required: [id, kind, name, archived, children]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        kind: { type: string, enum: [location, compute, container] }
        name: { type: string, minLength: 1, maxLength: 255 }
        archived: { type: boolean }
        children:
          {
            type: array,
            maxItems: 1000,
            items: { $ref: "#/components/schemas/InventoryTreeNode" },
          }
    InventoryTree:
      type: object
      additionalProperties: false
      required: [roots, truncated]
      properties:
        roots:
          {
            type: array,
            maxItems: 5000,
            items: { $ref: "#/components/schemas/InventoryTreeNode" },
          }
        truncated: { type: boolean }
    ComputeSummary:
      type: object
      additionalProperties: false
      required:
        [
          compute,
          container_count,
          stale_container_count,
          ip_assignment_count,
          cost_count,
          dns_link_count,
          snapshot_count,
        ]
      properties:
        compute: { $ref: "#/components/schemas/Compute" }
        container_count: { type: integer, minimum: 0 }
        stale_container_count: { type: integer, minimum: 0 }
        ip_assignment_count: { type: integer, minimum: 0 }
        cost_count: { type: integer, minimum: 0 }
        dns_link_count: { type: integer, minimum: 0 }
        snapshot_count: { type: integer, minimum: 0 }
    CurrencyTotal:
      type: object
      description: >-
        A monthly-equivalent estimate of active recurring costs in this currency.
        Entries are summed exactly and rounded half-up once to the currency's
        minor unit. One-time costs are excluded; this is not a bill or cash-flow total.
      additionalProperties: false
      required: [currency, amount_minor, currency_exponent]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        amount_minor:
          type: string
          pattern: "^(0|[1-9][0-9]*)$"
          description: >-
            Exact non-negative integer minor units, encoded as a decimal string
            to avoid aggregate overflow and JavaScript precision loss.
        currency_exponent: { type: integer, minimum: 0, maximum: 4 }
    DashboardSummary:
      type: object
      additionalProperties: false
      required:
        [
          generated_at,
          offline_compute_count,
          stale_resource_count,
          expiring_domain_count,
          dns_pending_count,
          dns_failed_count,
          recurring_costs,
        ]
      properties:
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        offline_compute_count: { type: integer, minimum: 0 }
        stale_resource_count: { type: integer, minimum: 0 }
        expiring_domain_count: { type: integer, minimum: 0 }
        dns_pending_count: { type: integer, minimum: 0 }
        dns_failed_count: { type: integer, minimum: 0 }
        recurring_costs:
          type: array
          maxItems: 64
          description: >-
            Monthly-equivalent estimates grouped by currency, using active recurring
            costs whose inclusive effective dates contain the current UTC date and
            whose owner is active. One-time costs are excluded.
          items: { $ref: "#/components/schemas/CurrencyTotal" }

    EnrollmentTokenCreate:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds:
          { type: integer, minimum: 60, maximum: 86400, default: 3600 }
    EnrollmentToken:
      type: object
      required: [id, compute_id, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        compute_id: { $ref: "#/components/schemas/UuidV7" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        consumed_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        revoked_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
    EnrollmentTokenSecret:
      allOf:
        - $ref: "#/components/schemas/EnrollmentToken"
        - type: object
          required: [token]
          properties:
            {
              token:
                { type: string, minLength: 32, maxLength: 512, readOnly: true },
            }
    ProtocolCompatibility:
      { type: string, enum: [compatible, upgrade_recommended, unsupported] }
    Agent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          compute_id,
          credential_generation,
          protocol_version,
          client_version,
          status,
          compatibility,
          enrolled_at,
          revision,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        compute_id: { $ref: "#/components/schemas/UuidV7" }
        credential_generation: { type: integer, minimum: 1 }
        protocol_version: { type: integer, minimum: 1, maximum: 2147483647 }
        client_version: { type: string, minLength: 1, maxLength: 100 }
        status: { $ref: "#/components/schemas/AgentStatus" }
        compatibility: { $ref: "#/components/schemas/ProtocolCompatibility" }
        enrolled_at: { $ref: "#/components/schemas/Timestamp" }
        last_heartbeat_at:
          { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        last_successful_snapshot_at:
          { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        last_error: { type: string, maxLength: 2000, nullable: true }
        revoked_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        revision: { $ref: "#/components/schemas/Revision" }
    AgentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        {
          items:
            {
              type: array,
              maxItems: 200,
              items: { $ref: "#/components/schemas/Agent" },
            },
          page: { $ref: "#/components/schemas/PageInfo" },
        }
    AgentEnrollRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, client_version]
      properties:
        protocol_version: { type: integer, minimum: 1, maximum: 2147483647 }
        client_version: { type: string, minLength: 1, maxLength: 100 }
    AgentEnrollment:
      type: object
      additionalProperties: false
      required:
        [
          agent_id,
          compute_id,
          credential,
          credential_generation,
          server_time,
          accepted_protocol,
          schedule,
        ]
      properties:
        agent_id: { $ref: "#/components/schemas/UuidV7" }
        compute_id: { $ref: "#/components/schemas/UuidV7" }
        credential:
          { type: string, minLength: 32, maxLength: 512, readOnly: true }
        credential_generation: { type: integer, minimum: 1 }
        server_time: { $ref: "#/components/schemas/Timestamp" }
        accepted_protocol: { $ref: "#/components/schemas/ProtocolRange" }
        schedule: { $ref: "#/components/schemas/AgentSchedule" }
    AgentHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, client_version, sent_at]
      properties:
        protocol_version: { type: integer, minimum: 1, maximum: 2147483647 }
        client_version: { type: string, minLength: 1, maxLength: 100 }
        sent_at: { $ref: "#/components/schemas/Timestamp" }
        last_collection_error: { type: string, maxLength: 2000, nullable: true }
    ProtocolRange:
      type: object
      additionalProperties: false
      required: [minimum, maximum]
      properties:
        minimum: { type: integer, minimum: 1 }
        maximum: { type: integer, minimum: 1 }
    AgentSchedule:
      type: object
      additionalProperties: false
      required: [heartbeat_interval_seconds, snapshot_interval_seconds]
      properties:
        heartbeat_interval_seconds:
          { type: integer, minimum: 10, maximum: 86400 }
        snapshot_interval_seconds:
          { type: integer, minimum: 60, maximum: 604800 }
    AgentProtocolWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            pattern: "^[a-z0-9_]+$",
          }
        message: { type: string, minLength: 1, maxLength: 1000 }
    AgentProtocolResponse:
      type: object
      additionalProperties: false
      required: [server_time, accepted_protocol, schedule, warnings]
      properties:
        server_time: { $ref: "#/components/schemas/Timestamp" }
        accepted_protocol: { $ref: "#/components/schemas/ProtocolRange" }
        schedule: { $ref: "#/components/schemas/AgentSchedule" }
        warnings:
          {
            type: array,
            maxItems: 20,
            items: { $ref: "#/components/schemas/AgentProtocolWarning" },
          }

    CollectionError:
      type: object
      additionalProperties: false
      required: [collector, code, message]
      properties:
        collector: { type: string, minLength: 1, maxLength: 200 }
        code:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            pattern: "^[a-z0-9_]+$",
          }
        message: { type: string, minLength: 1, maxLength: 2000 }
    HostSnapshot:
      type: object
      additionalProperties: false
      required:
        [
          machine_id,
          hostname,
          os_name,
          os_version,
          kernel_version,
          architecture,
          logical_cpu_count,
          memory_bytes,
        ]
      properties:
        machine_id: { type: string, minLength: 1, maxLength: 255 }
        hostname: { type: string, minLength: 1, maxLength: 253 }
        os_name: { type: string, minLength: 1, maxLength: 255 }
        os_version: { type: string, maxLength: 255 }
        kernel_version: { type: string, minLength: 1, maxLength: 255 }
        architecture: { type: string, minLength: 1, maxLength: 64 }
        cpu_model: { type: string, maxLength: 500 }
        logical_cpu_count: { type: integer, minimum: 1, maximum: 65536 }
        memory_bytes: { type: integer, format: int64, minimum: 0 }
        boot_id: { type: string, maxLength: 255 }
        booted_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        uptime_seconds: { type: integer, format: int64, minimum: 0 }
        virtualization_role:
          { type: string, enum: [none, host, guest, unknown] }
    DiskSnapshot:
      type: object
      additionalProperties: false
      required: [name, size_bytes]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        model: { type: string, maxLength: 500 }
        size_bytes: { type: integer, format: int64, minimum: 0 }
    FilesystemSnapshot:
      type: object
      additionalProperties: false
      required: [device, filesystem, mount_point, total_bytes, available_bytes]
      properties:
        device: { type: string, minLength: 1, maxLength: 4096 }
        filesystem: { type: string, minLength: 1, maxLength: 100 }
        mount_point: { type: string, minLength: 1, maxLength: 4096 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        available_bytes: { type: integer, format: int64, minimum: 0 }
    SnapshotContainer:
      type: object
      additionalProperties: false
      required:
        [
          name,
          runtime_id,
          image_name,
          state,
          health,
          restart_policy,
          ports,
          networks,
          mounts,
          labels,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        runtime_id: { type: string, minLength: 1, maxLength: 255 }
        image_name: { type: string, minLength: 1, maxLength: 1024 }
        image_id: { type: string, maxLength: 255 }
        image_digest: { type: string, maxLength: 255 }
        state:
          {
            type: string,
            enum: [created, running, paused, exited, stopped, unknown],
          }
        health:
          { type: string, enum: [none, starting, healthy, unhealthy, unknown] }
        created_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        started_at: { allOf: [{ $ref: "#/components/schemas/Timestamp" }] }
        restart_policy:
          {
            type: string,
            enum: [no, always, on_failure, unless_stopped, unknown],
          }
        restart_maximum_retry_count:
          { type: integer, minimum: 0, maximum: 2147483647 }
        ports:
          {
            type: array,
            maxItems: 2048,
            items: { $ref: "#/components/schemas/ContainerPort" },
          }
        networks:
          {
            type: array,
            maxItems: 256,
            items: { $ref: "#/components/schemas/ContainerNetwork" },
          }
        mounts:
          {
            type: array,
            maxItems: 2048,
            items: { $ref: "#/components/schemas/ContainerMount" },
          }
        labels:
          {
            type: array,
            maxItems: 512,
            items: { $ref: "#/components/schemas/ContainerLabel" },
          }
    PodmanCollectionSuccess:
      type: object
      additionalProperties: false
      required: [connection, owner, status, containers]
      properties:
        connection: { type: string, minLength: 1, maxLength: 200 }
        owner: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [success] }
        containers:
          {
            type: array,
            maxItems: 10000,
            items: { $ref: "#/components/schemas/SnapshotContainer" },
          }
    PodmanCollectionFailed:
      type: object
      additionalProperties: false
      required: [connection, owner, status, error]
      properties:
        connection: { type: string, minLength: 1, maxLength: 200 }
        owner: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [failed] }
        error: { type: string, minLength: 1, maxLength: 2000 }
    PodmanCollection:
      oneOf:
        - $ref: "#/components/schemas/PodmanCollectionSuccess"
        - $ref: "#/components/schemas/PodmanCollectionFailed"
      discriminator:
        propertyName: status
        mapping:
          success: "#/components/schemas/PodmanCollectionSuccess"
          failed: "#/components/schemas/PodmanCollectionFailed"
    DiscoverySnapshotWrite:
      type: object
      additionalProperties: false
      required:
        [
          report_id,
          protocol_version,
          client_version,
          collection_started_at,
          collection_finished_at,
          host,
          disks,
          interfaces,
          filesystems,
          podman,
          errors,
        ]
      properties:
        report_id: { $ref: "#/components/schemas/UuidV7" }
        protocol_version: { type: integer, minimum: 1, maximum: 2147483647 }
        client_version: { type: string, minLength: 1, maxLength: 100 }
        collection_started_at: { $ref: "#/components/schemas/Timestamp" }
        collection_finished_at: { $ref: "#/components/schemas/Timestamp" }
        host: { $ref: "#/components/schemas/HostSnapshot" }
        disks:
          {
            type: array,
            maxItems: 1024,
            items: { $ref: "#/components/schemas/DiskSnapshot" },
          }
        interfaces:
          {
            type: array,
            maxItems: 1024,
            items: { $ref: "#/components/schemas/NetworkInterfaceObservation" },
          }
        filesystems:
          {
            type: array,
            maxItems: 4096,
            items: { $ref: "#/components/schemas/FilesystemSnapshot" },
          }
        podman:
          {
            type: array,
            maxItems: 64,
            items: { $ref: "#/components/schemas/PodmanCollection" },
          }
        errors:
          {
            type: array,
            maxItems: 256,
            items: { $ref: "#/components/schemas/CollectionError" },
          }
    SnapshotAcceptance:
      type: object
      additionalProperties: false
      required:
        [
          report_id,
          result,
          received_at,
          content_reused,
          server_time,
          accepted_protocol,
          schedule,
        ]
      properties:
        report_id: { $ref: "#/components/schemas/UuidV7" }
        result: { type: string, enum: [accepted, accepted_with_errors] }
        received_at: { $ref: "#/components/schemas/Timestamp" }
        content_reused: { type: boolean }
        server_time: { $ref: "#/components/schemas/Timestamp" }
        accepted_protocol: { $ref: "#/components/schemas/ProtocolRange" }
        schedule: { $ref: "#/components/schemas/AgentSchedule" }

    DiscoveryReportResult:
      { type: string, enum: [accepted, accepted_with_errors, rejected] }
    CollectorResult:
      type: object
      additionalProperties: false
      required: [collector, status]
      properties:
        collector: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [success, failed] }
        error: { type: string, maxLength: 2000, nullable: true }
    DiscoveryReport:
      type: object
      additionalProperties: false
      required:
        [
          id,
          agent_id,
          compute_id,
          protocol_version,
          client_version,
          received_at,
          collection_started_at,
          collection_finished_at,
          result,
          content_id,
          content_reused,
          collector_results,
        ]
      properties:
        id: { $ref: "#/components/schemas/UuidV7" }
        agent_id: { $ref: "#/components/schemas/UuidV7" }
        compute_id: { $ref: "#/components/schemas/UuidV7" }
        protocol_version: { type: integer, minimum: 1 }
        client_version: { type: string, minLength: 1, maxLength: 100 }
